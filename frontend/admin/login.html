<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM Admin — Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin/static/admin.css" />
    <script src="/assets/lucide.min.js"></script>
  </head>
  <body class="bg-slate-900 flex items-center justify-center min-h-screen p-4 text-slate-800">
    <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow-2xl border border-slate-700/50">
      <!-- Header / Branding -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white mx-auto shadow-md mb-3">
          <i data-lucide="shield-alert" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-black tracking-tight text-slate-900">PRISM Administration</h1>
        <p class="text-xs text-slate-500 mt-1">National Infrastructure Operations & Control Plane</p>
      </div>

      <!-- Error Alert -->
      <div id="login-error-alert" role="alert" aria-live="assertive" aria-atomic="true" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 flex items-start gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 shrink-0 mt-0.5"></i>
        <div id="login-error-message">Invalid administrative credentials.</div>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="input-username" class="block text-xs font-semibold text-slate-700 mb-1">Administrative Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input
              type="text"
              id="input-username"
              name="username"
              required
              autocomplete="username"
              placeholder="e.g. admin"
              class="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-slate-900"
            />
          </div>
        </div>

        <div>
          <label for="input-password" class="block text-xs font-semibold text-slate-700 mb-1">Secret Access Key / Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i data-lucide="key-round" class="w-4 h-4"></i>
            </span>
            <input
              type="password"
              id="input-password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••••••"
              class="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-slate-900"
            />
          </div>
        </div>

        <button
          type="submit"
          id="btn-login-submit"
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-2"
        >
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Authenticate & Access Panel</span>
        </button>
      </form>

      <!-- Trust Assurance Footer -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <div class="text-[11px] text-slate-400">
          MoSPI PAIMANA Verified Infrastructure Intelligence &bull; SIH 2026
        </div>
        <div class="text-[10px] text-slate-400 mt-1">
          Authorized personnel only. All access and modification events are audited.
        </div>
      </div>
    </div>

    <script type="module">
      import { adminApi, showToast } from '/admin/static/admin.js';

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }

      const form = document.getElementById('admin-login-form');
      const errAlert = document.getElementById('login-error-alert');
      const errMsg = document.getElementById('login-error-message');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errAlert.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          <span>Verifying credentials...</span>
        `;

        const username = document.getElementById('input-username').value;
        const password = document.getElementById('input-password').value;

        try {
          await adminApi.login(username, password);
          window.location.href = '/admin';
        } catch (err) {
          errMsg.textContent = err.message || 'Authentication failed. Please verify credentials.';
          errAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>Authenticate & Access Panel</span>
          `;
          if (window.lucide) window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
