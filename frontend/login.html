<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM — Simulated Portal Sign-In</title>
    <meta
      name="description"
      content="Simulated sign-in portal for PRISM Predictive Risk Intelligence prototype. Prototype demonstration for SIH 2026."
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN progressive enhancement) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />

    <!-- PRISM Base Stylesheets -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <!-- Lucide Icons -->
    <script src="/assets/lucide.min.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-blue-100 selection:text-blue-900">
    <!-- Minimalist Top Bar -->
    <header class="w-full bg-white border-b border-slate-200/80 px-4 sm:px-8 py-3 flex items-center justify-between">
      <a
        href="/"
        class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-blue-700 transition"
      >
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Back to Home</span>
      </a>

      <div class="flex items-center gap-2">
        <img src="/assets/riskiq-mark-transparent.png" alt="RiskIQ" class="w-6 h-6 object-contain" />
        <span class="text-sm font-black tracking-tight text-slate-900">PRISM</span>
        <span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 text-[9px] font-bold">PAIMANA</span>
      </div>
    </header>

    <!-- Centered Sign-In Form Container -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-auto">
      <div class="w-full max-w-md">
        <!-- Main Card -->
        <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200 relative overflow-hidden">
          <!-- Subtle Accent Header Bar -->
          <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-500"></div>

          <!-- Card Header / Icon Badge & Animated Greeting -->
          <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
              <img src="/assets/riskiq-logo-transparent.png" alt="RiskIQ Logo" class="w-24 sm:w-28 h-auto object-contain mx-auto drop-shadow-sm hover:scale-105 transition-transform duration-200" />
            </div>
            
            <div class="flex items-center justify-center gap-2">
              <h1 class="text-xl font-black tracking-tight text-slate-900">PRISM</h1>
              <span class="badge bg-blue-50 text-blue-700 border border-blue-200 text-[10px] font-bold">DEMO PORTAL</span>
            </div>

            <!-- Animated Multilingual Welcome Greeting -->
            <div id="multilingual-greeting" class="multilingual-greeting my-2" aria-live="polite">
              <span class="greeting-text">नमस्ते</span>
              <span class="greeting-lang">Hindi</span>
            </div>

            <div class="text-xs font-semibold text-blue-700">Simulated Portal Sign-In</div>
            <p class="text-xs text-slate-500 mt-1">Type any username &amp; password to log in.</p>
          </div>

          <!-- Alert / Validation Banner -->
          <div
            id="login-alert"
            role="alert"
            aria-live="polite"
            class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 flex items-start gap-2"
          >
            <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 shrink-0 mt-0.5"></i>
            <div id="login-alert-text">Please enter a username and password.</div>
          </div>

          <!-- Simplified Simulated Sign-In Form -->
          <form id="simulated-login-form" class="space-y-4" novalidate>
            <!-- Username -->
            <div>
              <label for="input-username" class="block text-xs font-semibold text-slate-700 mb-1">
                Username
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none">
                  <i data-lucide="user" class="w-4 h-4"></i>
                </span>
                <input
                  type="text"
                  id="input-username"
                  name="username"
                  required
                  autocomplete="username"
                  placeholder="e.g. admin"
                  class="w-full pl-9 pr-3 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white text-slate-900 font-medium transition"
                />
              </div>
            </div>

            <!-- Password with Show/Hide Toggle -->
            <div>
              <label for="input-password" class="block text-xs font-semibold text-slate-700 mb-1">
                Password
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none">
                  <i data-lucide="lock" class="w-4 h-4"></i>
                </span>
                <input
                  type="password"
                  id="input-password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="••••••••••••"
                  class="w-full pl-9 pr-10 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white text-slate-900 font-medium transition"
                />
                <button
                  type="button"
                  id="btn-toggle-password"
                  aria-label="Show password"
                  aria-pressed="false"
                  class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 transition focus:outline-none cursor-pointer"
                >
                  <i data-lucide="eye" id="icon-toggle-password" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Remember Session & Simulated Auth Tag -->
            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 cursor-pointer select-none text-xs text-slate-600 font-medium">
                <input
                  type="checkbox"
                  id="checkbox-remember"
                  checked
                  class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500"
                />
                <span>Remember session</span>
              </label>

              <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-500 border border-slate-200">
                Simulated auth
              </span>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              id="btn-login-submit"
              class="w-full py-3 px-4 bg-gradient-to-r from-blue-700 to-indigo-600 hover:from-blue-800 hover:to-indigo-700 text-white font-bold rounded-xl text-xs shadow-sm hover:shadow transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 mt-2 cursor-pointer"
            >
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
              <span>Enter PRISM</span>
            </button>
          </form>
        </div>

        <!-- Footer Demonstration Note -->
        <div class="mt-6 text-center space-y-1.5">
          <div class="text-xs font-semibold text-slate-600">
            Prototype demonstration &bull; No backend credentials required
          </div>
          <div class="text-[11px] text-slate-400">
            Smart India Hackathon Prototype &bull; SIH26103 &bull; MoSPI PAIMANA
          </div>
        </div>
      </div>
    </main>

    <!-- Client-side Login Script (type="module") -->
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
