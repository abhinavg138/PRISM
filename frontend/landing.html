<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM — Predictive Risk Intelligence & Smart Monitoring</title>
    <meta
      name="description"
      content="PRISM Predictive Risk Intelligence platform for national infrastructure monitoring. Smart India Hackathon prototype (SIH26103)."
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN progressive enhancement) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />

    <!-- PRISM Base Stylesheets -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body class="h-full w-full bg-slate-50 text-slate-800 antialiased overflow-hidden flex items-center justify-center relative font-sans selection:bg-blue-100 selection:text-blue-900">
    <!-- Subtle Ambient Backdrop -->
    <div id="prism-backdrop" class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-50/70 via-slate-50 to-slate-100/60"></div>

    <!-- Centered Single Interactive Wordmark -->
    <main class="relative z-10 p-4 flex items-center justify-center">
      <a
        href="/login"
        id="prism-hero-trigger"
        class="group relative flex flex-col items-center justify-center p-8 sm:p-12 text-center rounded-3xl cursor-pointer select-none transition-transform duration-300 ease-out focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/40 focus-visible:ring-offset-8 focus-visible:ring-offset-slate-50"
        aria-label="Enter PRISM Predictive Risk Intelligence"
      >
        <!-- Soft Atmospheric Glow on Hover -->
        <div class="prism-ambient-glow"></div>

        <!-- Thematic Prism Light Refraction Flare Streak -->
        <div class="prism-refraction-flare" aria-hidden="true"></div>

        <!-- RiskIQ Logo -->
        <img
          src="/assets/riskiq-logo-transparent.png"
          alt="RiskIQ Logo"
          class="w-32 sm:w-44 md:w-52 h-auto mb-5 object-contain drop-shadow-md group-hover:scale-105 transition-transform duration-300 pointer-events-none"
        />

        <!-- Primary Wordmark -->
        <span
          class="prism-hero-wordmark text-6xl sm:text-8xl md:text-[9.5rem] lg:text-[11rem] font-black tracking-tighter leading-none bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 bg-clip-text text-transparent group-hover:scale-[1.02] transform transition-transform duration-300 ease-out"
        >
          PRISM
        </span>

        <!-- Subtle Subtitle Line -->
        <span
          class="mt-3 sm:mt-5 text-[11px] sm:text-xs font-semibold tracking-[0.28em] text-slate-400 group-hover:text-slate-600 uppercase transition-colors duration-300"
        >
          Predictive Risk Intelligence
        </span>
      </a>
    </main>

    <!-- Minimal Landing Script -->
    <script type="module" src="/js/landing.js"></script>
  </body>
</html>
